name: publish

on:
  push:
    branches: [main]
    paths:
      - 'pieces/**'
  workflow_dispatch:

# Serialize publishes so the records.json ledger can't race with itself.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write   # to commit the updated records.json ledger back

jobs:
  publish:
    runs-on: ubuntu-latest
    # Secrets (ATP_* and SITE_DISPATCH_TOKEN) are scoped to this environment for
    # compartmentalization. A GitHub environment is job-level, so both the
    # atproto-publish step and the site-dispatch step run under it.
    environment: at-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # The gate: never publish content that fails the schema.
      - name: Validate
        run: ./scripts/validate

      # Upsert site.standard.* records; delete records for removed pieces.
      - name: Publish atproto records
        env:
          ATP_IDENTIFIER: ${{ secrets.ATP_IDENTIFIER }}
          ATP_APP_PASSWORD: ${{ secrets.ATP_APP_PASSWORD }}
          ATP_PDS_URL: ${{ secrets.ATP_PDS_URL }}
        run: node scripts/publish-atproto

      # Commit the ledger back so slug -> at-uri stays inspectable in git.
      # Only pieces/** triggers this workflow, so pushing records.json won't loop.
      - name: Commit ledger
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add records.json
          git diff --cached --quiet || git commit -m "Update atproto records ledger [skip ci]"
          git push

      # Tell the site to rebuild from this repo's pieces/**.
      - name: Dispatch site rebuild
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/maxinelevesque/maxinelevesque.github.io/dispatches \
            -d '{"event_type":"content-updated"}'
